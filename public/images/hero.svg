<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Illustrasjon av norsk gård med sau og rød låve">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8d4ee"/>
      <stop offset="60%" stop-color="#dceef8"/>
      <stop offset="100%" stop-color="#eef7fd"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fb98a"/>
      <stop offset="100%" stop-color="#5da573"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#95c9a2"/>
      <stop offset="100%" stop-color="#79b788"/>
    </linearGradient>
    <linearGradient id="hill3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b5d9be"/>
      <stop offset="100%" stop-color="#95c9a2"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="1600" height="600" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="1280" cy="160" r="70" fill="#f7e8b0" opacity="0.9"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="300" cy="150" rx="110" ry="38"/>
    <ellipse cx="370" cy="130" rx="80" ry="30"/>
    <ellipse cx="980" cy="220" rx="90" ry="28"/>
    <ellipse cx="1040" cy="205" rx="60" ry="22"/>
  </g>

  <!-- distant hills -->
  <path d="M0,520 Q400,400 800,500 T1600,460 L1600,900 L0,900 Z" fill="url(#hill3)"/>

  <!-- mid hills -->
  <path d="M0,620 Q300,480 700,580 T1600,560 L1600,900 L0,900 Z" fill="url(#hill2)"/>

  <!-- foreground field -->
  <path d="M0,760 Q500,640 1100,730 T1600,700 L1600,900 L0,900 Z" fill="url(#hill1)"/>

  <!-- trees -->
  <g>
    <rect x="1210" y="470" width="14" height="60" fill="#7a5a3a"/>
    <circle cx="1217" cy="440" r="55" fill="#3f7d54"/>
    <circle cx="1180" cy="470" r="40" fill="#4a8c60"/>
    <circle cx="1252" cy="475" r="42" fill="#356b47"/>
    <rect x="90" y="520" width="12" height="50" fill="#7a5a3a"/>
    <circle cx="96" cy="495" r="45" fill="#3f7d54"/>
    <circle cx="132" cy="520" r="34" fill="#4a8c60"/>
  </g>

  <!-- barn -->
  <g>
    <rect x="560" y="500" width="220" height="140" fill="#b04a3a"/>
    <polygon points="540,500 670,420 800,500" fill="#8f3b2e"/>
    <rect x="640" y="560" width="60" height="80" fill="#5c2f26"/>
    <rect x="655" y="575" width="30" height="25" fill="#f2e3c8"/>
    <rect x="580" y="530" width="26" height="26" fill="#f2e3c8"/>
    <rect x="730" y="530" width="26" height="26" fill="#f2e3c8"/>
    <line x1="540" y1="500" x2="800" y2="500" stroke="#7a3529" stroke-width="6"/>
  </g>

  <!-- fence -->
  <g stroke="#8a6a48" stroke-width="8" stroke-linecap="round">
    <line x1="300" y1="740" x2="560" y2="725"/>
    <line x1="300" y1="775" x2="560" y2="760"/>
    <line x1="330" y1="720" x2="330" y2="790"/>
    <line x1="420" y1="718" x2="420" y2="788"/>
    <line x1="510" y1="715" x2="510" y2="785"/>
  </g>

  <!-- sheep -->
  <g>
    <g transform="translate(980,780)">
      <ellipse cx="0" cy="0" rx="46" ry="32" fill="#f5f2ea"/>
      <rect x="-38" y="18" width="10" height="24" rx="4" fill="#4d4d4d"/>
      <rect x="24" y="18" width="10" height="24" rx="4" fill="#4d4d4d"/>
      <circle cx="52" cy="-14" r="20" fill="#3d3d3d"/>
      <circle cx="58" cy="-18" r="5" fill="#f5f2ea"/>
    </g>
    <g transform="translate(1130,810) scale(0.85)">
      <ellipse cx="0" cy="0" rx="46" ry="32" fill="#f5f2ea"/>
      <rect x="-38" y="18" width="10" height="24" rx="4" fill="#4d4d4d"/>
      <rect x="24" y="18" width="10" height="24" rx="4" fill="#4d4d4d"/>
      <circle cx="52" cy="-14" r="20" fill="#3d3d3d"/>
      <circle cx="58" cy="-18" r="5" fill="#f5f2ea"/>
    </g>
    <g transform="translate(860,820) scale(0.7)">
      <ellipse cx="0" cy="0" rx="46" ry="32" fill="#f5f2ea"/>
      <rect x="-38" y="18" width="10" height="24" rx="4" fill="#4d4d4d"/>
      <rect x="24" y="18" width="10" height="24" rx="4" fill="#4d4d4d"/>
      <circle cx="52" cy="-14" r="20" fill="#3d3d3d"/>
      <circle cx="58" cy="-18" r="5" fill="#f5f2ea"/>
    </g>
  </g>

  <!-- birds -->
  <g stroke="#526b80" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M480,180 q15,-12 30,0 q15,-12 30,0"/>
    <path d="M560,140 q12,-10 24,0 q12,-10 24,0"/>
  </g>

  <!-- grass tufts -->
  <g stroke="#4a8c60" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M200,850 q5,-18 12,-24"/>
    <path d="M215,852 q-2,-16 -8,-26"/>
    <path d="M1450,840 q5,-18 12,-24"/>
    <path d="M1462,845 q-2,-16 -8,-26"/>
  </g>
</svg>
